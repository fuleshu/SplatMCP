<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SplatMCP</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101316;
        --panel: #191d21;
        --border: #2a3036;
        --text: #e6e8ea;
        --muted: #9aa4ad;
        --accent: #4da3ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      .toolbar button {
        font: inherit;
        color: var(--text);
        background: #23282e;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .toolbar button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .toolbar button:disabled {
        color: var(--muted);
        opacity: 0.55;
        cursor: default;
      }
      .brand {
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-right: 4px;
      }
      #status {
        margin-left: auto;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #viewer {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      #viewer canvas {
        position: absolute;
        inset: 0;
        display: block;
        outline: none;
      }
      #splat-status {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(12, 14, 16, 0.82);
        border: 1px solid var(--border);
        color: var(--muted);
        pointer-events: none;
      }
      .workspace {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }
      .sidebar {
        flex: 0 0 320px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
      }
      .components {
        list-style: none;
        margin: 0 0 0.5rem;
        padding: 0;
        max-height: 9rem;
        overflow-y: auto;
      }

      .components .component {
        padding: 0.15rem 0.3rem;
        cursor: pointer;
        border-radius: 3px;
        font-size: 0.8rem;
      }

      .components .component.selected {
        background: rgba(90, 140, 255, 0.25);
      }

      .components .component.empty {
        cursor: default;
        opacity: 0.6;
      }

      .sidebar h2 {
        margin: 0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        color: var(--muted);
        font-size: 12px;
      }
      .field input,
      .field textarea {
        font: inherit;
        color: var(--text);
        background: #14181c;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 7px;
      }
      .field textarea {
        min-height: 150px;
        resize: vertical;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        white-space: pre;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .row button {
        flex: 0 0 auto;
        font: inherit;
        color: var(--text);
        background: #23282e;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .row button:disabled {
        color: var(--muted);
        opacity: 0.55;
        cursor: default;
      }
      .checks {
        display: flex;
        gap: 14px;
        color: var(--muted);
        font-size: 12px;
      }
      #python-runtime[data-state="unavailable"] {
        color: #ff9a8b;
      }
      #python-job {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      #python-log {
        flex: 1 1 auto;
        min-height: 90px;
        max-height: 200px;
        overflow-y: auto;
        margin: 0;
        padding: 6px 8px;
        background: #12161a;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 11px;
        white-space: pre-wrap;
      }
      .hint {
        position: absolute;
        left: 16px;
        bottom: 12px;
        color: var(--muted);
        background: rgba(12, 14, 16, 0.62);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <span class="brand">SplatMCP</span>
        <button id="open-button" type="button">Open Splat</button>
        <button id="save-button" type="button" disabled>Save Splat</button>
        <p id="status"></p>
      </header>
      <div class="workspace">
        <aside class="sidebar">
          <h2>Components</h2>
          <ul id="component-list" class="components"></ul>
          <p id="component-summary"></p>
          <div class="field">
            <label for="component-name">Name</label>
            <input id="component-name" type="text" placeholder="hair"
                   title="Display name for a new component, or the new name when renaming. Names are labels, not identities." />
          </div>
          <div class="row">
            <button id="component-create" type="button" title="Create a component with this name.">Create</button>
            <button id="component-rename" type="button" title="Rename the selected component; its id does not change.">Rename</button>
            <button id="component-remove" type="button" title="Remove the selected component. Its gaussians stay in the document.">Remove</button>
          </div>
          <div class="field">
            <label for="component-box">Selection box (min x,y,z / max x,y,z)</label>
            <div class="row" id="component-box">
              <input id="component-box-min-x" placeholder="min x" title="Selection box minimum x" />
              <input id="component-box-min-y" placeholder="min y" title="Selection box minimum y" />
              <input id="component-box-min-z" placeholder="min z" title="Selection box minimum z" />
              <input id="component-box-max-x" placeholder="max x" title="Selection box maximum x" />
              <input id="component-box-max-y" placeholder="max y" title="Selection box maximum y" />
              <input id="component-box-max-z" placeholder="max z" title="Selection box maximum z" />
            </div>
          </div>
          <div class="row">
            <button id="component-select" type="button" title="Resolve the box (and the selected component) to a revision-bound selection handle; the reply reports count and bounds.">Select</button>
            <button id="component-bind" type="button" title="Bind the selection to the selected component. No geometry moves.">Bind</button>
          </div>
          <div class="field">
            <label for="component-frame">Local frame (t x,y,z / s x,y,z)</label>
            <div class="row" id="component-frame">
              <input id="component-frame-tx" placeholder="t x" title="Frame translation x, in metres" />
              <input id="component-frame-ty" placeholder="t y" title="Frame translation y, in metres" />
              <input id="component-frame-tz" placeholder="t z" title="Frame translation z, in metres" />
              <input id="component-frame-sx" placeholder="s x" title="Frame scale x. Non-uniform scales transform anisotropic gaussians through their covariance." />
              <input id="component-frame-sy" placeholder="s y" title="Frame scale y" />
              <input id="component-frame-sz" placeholder="s z" title="Frame scale z" />
            </div>
          </div>
          <div class="row">
            <button id="component-transform" type="button" title="Declare (or clear) the selected component's explicit local frame.">Set frame</button>
            <button id="component-apply" type="button" title="Transform the component's members through its frame, as one committed edit.">Apply frame</button>
          </div>
          <h2>Edit history</h2>
          <div class="row">
            <button id="edit-undo" type="button" title="Undo the newest step as a new revision.">Undo</button>
            <button id="edit-redo" type="button" title="Redo the newest undone step as a new revision.">Redo</button>
          </div>
          <p id="edit-history"></p>
          <h2>Python generation</h2>
          <p id="python-runtime">Checking the Python runtime&hellip;</p>
          <div class="field">
            <label for="python-script-path">Script file</label>
            <input id="python-script-path" type="text" placeholder="C:\recipes\terrain.py"
                   title="Path of a .py file. Load reads it, Save writes it; Run snapshots the editor content." />
          </div>
          <div class="row">
            <button id="python-load" type="button" title="Read the script file into the editor.">Load</button>
            <button id="python-save" type="button" title="Write the editor content to the script file.">Save</button>
          </div>
          <div class="field">
            <label for="python-script">Recipe</label>
            <textarea id="python-script" spellcheck="false" placeholder="def generate(ctx):&#10;    return splatmcp.axis_fixture()"
                      title="The script that runs in the embedded interpreter. It must define generate(ctx) and return splatmcp.batch(...)."></textarea>
          </div>
          <div class="field">
            <label for="python-params">Params (JSON)</label>
            <input id="python-params" type="text" placeholder='{"count": 200000}'
                   title="Parameters the script reads as ctx.params." />
          </div>
          <div class="row">
            <div class="field" style="flex: 1 1 auto">
              <label for="python-seed">Seed</label>
              <input id="python-seed" type="number" value="0" title="Seed for ctx.rng(); the same seed and recipe reproduce the same geometry." />
            </div>
            <div class="field" style="flex: 1 1 auto">
              <label for="python-component">Component</label>
              <input id="python-component" type="text" placeholder="(whole document)"
                     title="Name of the component this job replaces. Leave empty to replace the whole document." />
            </div>
          </div>
          <div class="row">
            <div class="field" style="flex: 1 1 auto">
              <label for="python-revision">Expected revision</label>
              <input id="python-revision" type="number" min="0" placeholder="(new document)"
                     title="Revision this edit starts from. A job that starts from a stale revision is refused instead of overwriting newer work." />
            </div>
            <div class="field" style="flex: 1 1 auto">
              <label for="python-export">Export .ply</label>
              <input id="python-export" type="text" placeholder="(none)"
                     title="Optional path to write the generated result to as well as showing it." />
            </div>
          </div>
          <div class="checks">
            <label><input id="python-display" type="checkbox" checked
                          title="Show the committed revision in the viewer when it is ready." /> Display</label>
            <label><input id="python-frame" type="checkbox" checked
                          title="Re-frame the camera on the new revision; uncheck to keep the current view." /> Frame</label>
          </div>
          <div class="row">
            <button id="python-run" type="button" title="Submit the recipe to the app's shared generation service.">Run</button>
            <button id="python-cancel" type="button" disabled
                    title="Ask the running job to stop. A native NumPy call can delay the stop.">Cancel</button>
          </div>
          <p id="python-job"></p>
          <div id="python-log"></div>
        </aside>
        <main id="viewer">
          <p id="splat-status" hidden></p>
          <p class="hint">drag orbit &middot; right-drag pan &middot; wheel zoom &middot; WASD fly</p>
        </main>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
