<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SplatMCP</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101316;
        --panel: #191d21;
        --border: #2a3036;
        --text: #e6e8ea;
        --muted: #9aa4ad;
        --accent: #4da3ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      .toolbar button {
        font: inherit;
        color: var(--text);
        background: #23282e;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .toolbar button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .toolbar button:disabled {
        color: var(--muted);
        opacity: 0.55;
        cursor: default;
      }
      .brand {
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-right: 4px;
      }
      #status {
        margin-left: auto;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #viewer {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      #viewer canvas {
        position: absolute;
        inset: 0;
        display: block;
        outline: none;
      }
      #splat-status {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(12, 14, 16, 0.82);
        border: 1px solid var(--border);
        color: var(--muted);
        pointer-events: none;
      }
      .hint {
        position: absolute;
        left: 16px;
        bottom: 12px;
        color: var(--muted);
        background: rgba(12, 14, 16, 0.62);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <span class="brand">SplatMCP</span>
        <button id="open-button" type="button">Open Splat</button>
        <button id="save-button" type="button" disabled>Save Splat</button>
        <p id="status"></p>
      </header>
      <main id="viewer">
        <p id="splat-status" hidden></p>
        <p class="hint">drag orbit &middot; right-drag pan &middot; wheel zoom &middot; WASD fly</p>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
