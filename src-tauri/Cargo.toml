[package]
name = "splatmcp"
description = "SplatMCP - 3D Gaussian Splat editor with an MCP server"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"
default-run = "splatmcp"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
splatmcp-bridge = { path = "../crates/splatmcp-bridge" }
splatmcp-core = { path = "../crates/splatmcp-core" }
# The desktop process is the only place that links CPython: the MCP server talks to this
# app over the bridge instead of embedding a second interpreter.
splatmcp-python = { path = "../crates/splatmcp-python", features = ["embedded"] }
tauri = { version = "2", features = [] }
