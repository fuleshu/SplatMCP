[package]
name = "splatmcp-python"
description = "Embedded CPython executor and NumPy array contract for SplatMCP procedural Gaussian generation"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "splatmcp_python"
path = "src/lib.rs"

[features]
# The interpreter binding is optional so the array contract, job store and geometry
# helpers still build and test on a machine without a Python installation.
default = ["embedded"]
embedded = ["dep:pyo3", "dep:numpy"]

[dependencies]
numpy = { version = "0.29", optional = true }
pyo3 = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
splatmcp-core = { path = "../splatmcp-core" }
thiserror = "2"
