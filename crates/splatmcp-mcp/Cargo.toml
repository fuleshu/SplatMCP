[package]
name = "splatmcp-mcp"
description = "SplatMCP MCP server (rmcp) for creating and editing 3D Gaussian Splats"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "splatmcp_mcp"
path = "src/lib.rs"

[[bin]]
name = "splatmcp-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Base64 for PLY bytes and captured frames travelling over the bridge.
base64 = "0.22"
# Official Rust MCP SDK: https://github.com/modelcontextprotocol/rust-sdk
# The `server` feature also enables rmcp's schemars re-export, which is what the tool
# parameter types derive from.
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-io",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
splatmcp-bridge = { path = "../splatmcp-bridge" }
splatmcp-core = { path = "../splatmcp-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
