[package]
name = "splatmcp-bridge"
description = "Loopback bridge between the SplatMCP MCP server and the SplatMCP desktop app"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "splatmcp_bridge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
