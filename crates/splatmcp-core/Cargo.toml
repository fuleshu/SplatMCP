[package]
name = "splatmcp-core"
description = "SplatMCP Gaussian splat model with PLY import and export (fixed colour, no spherical harmonics)"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "splatmcp_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Only the capture contract's tests read it back as JSON, where a u64 is checked to survive as
# exact decimal digits.
serde_json = "1"
